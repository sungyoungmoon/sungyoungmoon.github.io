<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Everyday Guide — Demonstration</title>
<style>
  :root{--bg:#eff1f4;--card:#fff;--ink:#16181c;--ink2:#5c636d;--ink3:#878e98;
        --line:rgba(16,18,22,.1);--fill:#eceef1;--accent:#0e7c87;--on:#fff;--err:#9c3229;
        color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--bg:#0a0b0d;--card:#17191e;--ink:#f2f4f6;
        --ink2:#a3aab4;--ink3:#767d87;--line:rgba(255,255,255,.1);--fill:#23262c;
        --accent:#57d3e0;--on:#062c31;--err:#ff9f97;color-scheme:dark}}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
       -webkit-font-smoothing:antialiased}
  .gate{min-height:100%;display:grid;place-items:center;padding:24px}
  .box{width:100%;max-width:360px}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
           color:var(--ink3);margin:0 0 8px}
  h1{margin:0 0 6px;font-size:26px;font-weight:640;letter-spacing:-.022em}
  .sub{margin:0 0 22px;font-size:14px;line-height:1.45;color:var(--ink2)}
  label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px}
  input{width:100%;padding:12px 14px;font:inherit;font-size:16px;color:var(--ink);
        background:var(--card);border:1px solid var(--line);border-radius:12px}
  input:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
  button{width:100%;margin-top:10px;padding:12px;font:inherit;font-size:15px;font-weight:590;
         color:var(--on);background:var(--accent);border:0;border-radius:12px;cursor:pointer}
  button:disabled{opacity:.5;cursor:progress}
  .msg{margin:12px 0 0;font-size:13px;line-height:1.45;min-height:1.2em}
  .msg[data-kind=error]{color:var(--err)}
  .msg[data-kind=info]{color:var(--ink3)}
  .foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);
        font-size:12px;line-height:1.5;color:var(--ink3)}
</style>
</head>
<body>
<div id="root"></div>
<div class="gate" id="gate">
  <form class="box" id="form">
    <p class="eyebrow">Private demonstration</p>
    <h1>Everyday Guide</h1>
    <p class="sub">An educational diabetes assistant. Enter the password you were given to open the demo.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <button type="submit" id="go">Open demo</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <p class="foot">A demonstration only — general education, not medical advice, and not a real
    service. Sample data throughout.</p>
  </form>
</div>

const gate = document.getElementById("gate");
const form = document.getElementById("form");
const pw = document.getElementById("pw");
const go = document.getElementById("go");
const msg = document.getElementById("msg");

const b = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

function say(text, kind) { msg.textContent = text; msg.dataset.kind = kind || ""; }

async function unlock(password) {
  const baseKey = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b(DATA.salt), iterations: DATA.it, hash: "SHA-256" },
    baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b(DATA.iv) }, key, b(DATA.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function run(app) {
  const style = document.createElement("style");
  style.textContent = app.css;
  document.head.appendChild(style);
  gate.remove();
  // The bundle is an ES module, so hand it to the loader as one.
  const url = URL.createObjectURL(new Blob([app.js], { type: "text/javascript" }));
  await import(url);
  URL.revokeObjectURL(url);
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const value = pw.value;
  if (!value) return;
  go.disabled = true;
  say("Opening\u2026", "info");
  try {
    const app = await unlock(value);
    try { sessionStorage.setItem("eg-pw", value); } catch {}
    await run(app);
  } catch {
    go.disabled = false;
    say("That password did not work. Check it and try again.", "error");
    pw.select();
  }
});

// Skip the gate for the rest of this browser tab.
(async () => {
  let saved = null;
  try { saved = sessionStorage.getItem("eg-pw"); } catch {}
  if (!saved) return;
  try { await run(await unlock(saved)); } catch {
    try { sessionStorage.removeItem("eg-pw"); } catch {}
  }
})();
</script>
